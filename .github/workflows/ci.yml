name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor scripts/install-native.sh accepts, and a current release.
        # The collector is meant to keep running for years on whatever Python a
        # Raspberry Pi image happens to ship, so the floor is worth testing.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # The site tests compare this pipeline against ESB's own published CML,
      # CI and CAIDI, so they need the real corpus. Without it they skip, and a
      # silently skipped credibility check is worse than none.
      - name: Check out the collected data
        uses: actions/checkout@v7
        with:
          repository: baz8080/esb-data
          path: esb-data

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}

      - name: Rebuild the database from the raw logs
        run: uv run python -m esb_outages --data-dir esb-data rebuild

      - name: Test
        env:
          ESB_DATA_DIR: esb-data
        run: uv run python -m unittest discover -s tests -t . --verbose
