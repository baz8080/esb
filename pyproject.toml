# The collector runs on the standard library alone - `dependencies` is empty
# and stays empty, because the collector is installed by copying it onto a
# Raspberry Pi with nothing but Python and tzdata available. The site generator
# has one dependency, the shared statusui design layer, carried in the `site`
# group so the collector's floor is untouched.
[project]
name = "esb"
version = "1.0.0"
description = "Long-term collector and status site for ESB Networks outage data"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.15"]
site = ["statusui"]

# Pinned to a commit in uv.lock; ../statusui/rollout.sh moves the pin.
# Temporarily tracking the alignment branch; repoint to the bare URL and
# re-lock once statusui's claude/uisce-esb-design-alignment-djqu7s merges.
[tool.uv.sources]
statusui = { git = "https://github.com/baz8080/statusui", branch = "claude/uisce-esb-design-alignment-djqu7s" }

# Not a distributable package: both entry points are run as modules from the
# source tree, and the Pi install is a file copy. Without this uv would try to
# build a wheel on every `uv run`.
[tool.uv]
package = false
default-groups = ["dev", "site"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pycodestyle errors, pyflakes, import order, bugbear, and comprehension and
# pyupgrade rules. ruff takes its target version from requires-python above, so
# the pyupgrade rules cannot suggest syntax the Raspberry Pi floor will not run.
select = ["E", "F", "I", "B", "C4", "UP"]
