name: CI

on:
  # Branches are covered by the pull_request trigger; push only runs for main.
  push:
    branches: [main]
    paths-ignore:
      - "notes/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "notes/**"
      - "**.md"

# A newer push to the same PR/branch supersedes the run in flight (never cancel main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # Draft PRs skip CI until marked ready for review.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # The site tests compare this pipeline against ESB's own published CML,
      # CI and CAIDI, so they need the real corpus. Without it they skip, and a
      # silently skipped credibility check is worse than none.
      - name: Check out the collected data
        uses: actions/checkout@v7
        with:
          repository: baz8080/esb-data
          path: esb-data

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Rebuild the database from the raw logs
        run: uv run python -m esb_outages --data-dir esb-data rebuild

      - name: Test
        env:
          ESB_DATA_DIR: esb-data
        run: uv run python -m unittest discover -s tests -t . --verbose
