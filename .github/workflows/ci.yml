name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      # Both legs report: a floor that only fails after the other leg is
      # cancelled tells you nothing about which one broke.
      fail-fast: false
      matrix:
        # 3.11 is `requires-python`, and what the Pi runs — bookworm's python3.
        # 3.14 is `.python-version`, what a contributor and the site build get.
        # ruff only guards the floor's *syntax*; a 3.12-only stdlib call would
        # lint clean, pass on 3.14 and fail at deploy. This is what stops it.
        python: ["3.11", "3.14"]
    env:
      # beats .python-version, so the leg picks the interpreter without the
      # checkout having to be edited
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # The site tests compare this pipeline against ESB's own published CML,
      # CI and CAIDI, so they need the real corpus. Without it they skip, and a
      # silently skipped credibility check is worse than none.
      - name: Check out the collected data
        uses: actions/checkout@v7
        with:
          repository: baz8080/esb-data
          path: esb-data

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Rebuild the database from the raw logs
        run: uv run python -m esb_outages --data-dir esb-data rebuild

      - name: Test
        env:
          ESB_DATA_DIR: esb-data
        run: uv run python -m unittest discover -s tests -t . --verbose
